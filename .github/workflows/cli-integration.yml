name: CLI integration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli:
    name: Real ${{ matrix.cli }} CLI (mock API)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - cli: codex
            package: '@openai/codex@0.171.0'
          - cli: claude
            package: '@anthropic-ai/claude-code@2.1.322'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install test CLI and hook prerequisites
        env:
          CLI_PACKAGE: ${{ matrix.package }}
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          npm install --global "$CLI_PACKAGE"
      - name: Record CLI version
        env:
          TEST_CLI: ${{ matrix.cli }}
        run: '"$TEST_CLI" --version'
      - name: Exercise real plugin hooks with local API
        env:
          TEST_CLI: ${{ matrix.cli }}
        run: python3 "tests/integration/${TEST_CLI}_cli.py" --output-dir "$RUNNER_TEMP/cli-integration/$TEST_CLI"
      - name: Retain integration evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-integration-${{ matrix.cli }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cli-integration/${{ matrix.cli }}/*/*.json
            ${{ runner.temp }}/cli-integration/${{ matrix.cli }}/*/*.jsonl
            ${{ runner.temp }}/cli-integration/${{ matrix.cli }}/*/*.log
            ${{ runner.temp }}/cli-integration/${{ matrix.cli }}/*/*.stdout
            ${{ runner.temp }}/cli-integration/${{ matrix.cli }}/*/*.stderr
            ${{ runner.temp }}/cli-integration/${{ matrix.cli }}/*/project/package.json
          if-no-files-found: warn
          retention-days: 14
