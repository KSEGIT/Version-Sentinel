# NOTE: {{args}} is raw-substituted into this prompt text (it is only
# shell-escaped inside !{} blocks, which we don't use). Treat {{args}} purely
# as the argument list for the script below — never invent or alter values.
description = "Record a fresh version check in the version-sentinel sidecar"
prompt = """
Record that a dependency version has been verified against an upstream registry.

Use the run_shell_command tool to execute exactly:

  bash "${extensionPath}/scripts/vs-record.sh" {{args}}

Then relay the script's output verbatim to the user.

Argument format (four arguments, space-separated):

  <ecosystem> <pkg> <version> <source-url-or-intentional:reason>

- ecosystem: one of npm, pip, cargo, csproj, pyproject
- pkg: package name
- version: the verified version string
- source: an http(s):// URL to the registry page, or intentional:<reason>
  when the version is a deliberate pin

Examples:

  /vs-record npm lodash 4.17.21 https://www.npmjs.com/package/lodash
  /vs-record pip requests 2.31.0 https://pypi.org/project/requests/
  /vs-record csproj Serilog 3.1.1 intentional: CVE lock pending audit

If the user gave no or incomplete arguments, ask for the missing ones instead
of guessing. Pass the arguments through exactly as provided — do not modify,
quote-rewrite, or fabricate versions, URLs, or reasons.
"""
