# NOTE: {{args}} is raw-substituted into this prompt text (it is only
# shell-escaped inside !{} blocks, which we don't use). This command takes no
# arguments; ignore any {{args}} content rather than inventing flags.
description = "Audit dependencies against upstream registries (npm, pypi, nuget, crates.io)"
prompt = """
Run the bundled online audit in the affected project directory. Use the directory
named in the startup warning, or the user's current project if there is no warning.
Use it after a
"Version Sentinel startup audit failed" warning or when audit evidence is
missing or expired. The audit-dependencies skill provides the same workflow.

Use the run_shell_command tool with dir_path set to that project's absolute path
to execute exactly:

  bash "${extensionPath}/scripts/check-versions.sh"

Then interpret the drift report for the user:

- Scans package.json, requirements*.txt, constraints*.txt, pyproject.toml,
  Cargo.toml, *.csproj, *.fsproj, and *.vbproj and compares each version to the
  latest upstream release (npmjs.com, pypi.org, crates.io, nuget.org).
- DRIFT means the pinned version differs from the latest upstream version.
- intentional-pin means the version was deliberately pinned via
  `/vs-record ... intentional:<reason>` — it is not drift; report it as such.
- A successful audit records current project evidence in
  .version-sentinel/audit.json without changing dependency versions.
- Report the exit status and full diagnostic. Drift alone does not fail the audit. Registry, prerequisite, and manifest errors are advisory: continue authorized work and report the limitation. Preserve npm overrides and other selectors. Do not change dependencies to make the audit pass. No Version Sentinel recovery-consent command is needed; normal authorization rules for destructive changes still apply separately.

Summarize drift and unknown results. Do not change versions unless the user requests it. Hooks always allow work, even when this audit fails.
"""
